<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio InLead</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 100%; 
            height: 100vh; 
            overflow: hidden; 
            background: transparent; 
        }
        #overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: transparent;
            z-index: 999999;
            cursor: pointer;
        }
        #overlay.hide { display: none; }
    </style>
</head>
<body>
    <div id="overlay"></div>
    
    <audio id="audio" preload="auto">
        <source src="https://raonygar.github.io/audio-inlead-codigo/Audio%20Depoimento%20-%20C%C3%B3digo.MP3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('audio');
        const overlay = document.getElementById('overlay');
        
        let playing = false;
        
        function forcePlay() {
            audio.currentTime = 0;
            audio.volume = 1.0;
            audio.muted = false;
            
            audio.play()
                .then(() => {
                    playing = true;
                    overlay.className = 'hide';
                    console.log('✓ Áudio TOCANDO');
                    monitorButton();
                })
                .catch(err => {
                    console.error('Erro ao tocar:', err);
                });
        }
        
        function forceStop() {
            audio.pause();
            audio.currentTime = 0;
            playing = false;
            console.log('⏹ Áudio PARADO');
        }
        
        function monitorButton() {
            // MutationObserver para DOM dinâmico
            const observer = new MutationObserver(checkButton);
            observer.observe(document.body, { 
                childList: true, 
                subtree: true 
            });
            
            // Listener global para cliques
            document.addEventListener('click', (e) => {
                const target = e.target;
                if (!target.matches('button, a, input[type="submit"], [role="button"]')) {
                    return;
                }
                
                const text = (target.textContent || target.value || '').toLowerCase();
                
                if ((text.includes('iniciar') && text.includes('test')) ||
                    text === 'iniciar el test' ||
                    text === 'comenzar el test' ||
                    text === 'empezar el test') {
                    console.log('🎯 Botão "Iniciar el test" detectado!');
                    forceStop();
                }
            }, true);
            
            checkButton();
            console.log('🔍 Monitorando botão "Iniciar el test"');
        }
        
        function checkButton() {
            document.querySelectorAll('button, a, input[type="submit"], [role="button"]').forEach(btn => {
                const text = (btn.textContent || btn.value || '').toLowerCase();
                
                if ((text.includes('iniciar') && text.includes('test')) ||
                    text === 'iniciar el test') {
                    if (!btn.dataset.audioListener) {
                        btn.dataset.audioListener = '1';
                        btn.addEventListener('click', () => {
                            console.log('🎯 Botão clicado!');
                            forceStop();
                        }, true);
                        console.log('✓ Botão encontrado e anexado');
                    }
                }
            });
        }
        
        // Captura primeira interação
        overlay.addEventListener('click', forcePlay);
        overlay.addEventListener('touchstart', forcePlay);
        
        // Eventos do áudio
        audio.addEventListener('ended', () => {
            playing = false;
            console.log('✓ Áudio FINALIZADO');
        });
        
        audio.addEventListener('error', (e) => {
            console.error('❌ Erro ao carregar áudio:', e);
        });
        
        audio.addEventListener('loadeddata', () => {
            console.log('✓ Áudio carregado | Duração:', audio.duration.toFixed(0) + 's');
        });
        
        console.log('🚀 Sistema inicializado');
    </script>
</body>
</html>
