<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player InLead</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: transparent;
        }
        /* Overlay invisível para capturar primeira interação */
        #interaction-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 999999;
            cursor: pointer;
            display: block;
        }
        #interaction-overlay.hidden {
            display: none;
        }
        /* Indicador visual (OCULTO por padrão - descomente para debug) */
        #audio-status {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
            z-index: 999998;
            display: none; /* Oculto - mude para 'block' para debug */
        }
    </style>
</head>
<body>
    <!-- Overlay para capturar primeira interação -->
    <div id="interaction-overlay"></div>

    <div id="audio-status">⏸ Aguardando interação...</div>

    <audio id="audio-player" preload="auto" style="display: none;">

    </audio>
